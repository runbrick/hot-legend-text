<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>热血传奇放置</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Character Selection Screen -->
  <div id="char-select-screen" class="screen active">
    <div class="select-container">
      <div class="title">热血传奇放置</div>
      <div class="subtitle">全文字放置游戏</div>
      <div id="char-list" class="char-list"></div>
      <div id="create-char-panel" class="create-panel"></div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <!-- Title Bar -->
    <div class="title-bar">
      <span class="title-text">热血传奇放置</span>
      <span id="game-status" class="game-status">● 挂机中</span>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Left Panel: Character Info + Equipment -->
      <div class="left-panel">
        <!-- Character Summary -->
        <div class="panel char-panel">
          <div class="panel-title">角色信息</div>
          <div id="char-summary" class="char-summary"></div>
          <div class="bars">
            <div class="bar-row"><span class="bar-label">HP</span><div class="bar-bg"><div id="hp-bar" class="bar-fill hp-fill"></div></div><span id="hp-text" class="bar-text"></span></div>
            <div class="bar-row"><span class="bar-label">MP</span><div class="bar-bg"><div id="mp-bar" class="bar-fill mp-fill"></div></div><span id="mp-text" class="bar-text"></span></div>
            <div class="bar-row"><span class="bar-label">EXP</span><div class="bar-bg"><div id="exp-bar" class="bar-fill exp-fill"></div></div><span id="exp-text" class="bar-text"></span></div>
          </div>
        </div>

        <!-- Stats Panel -->
        <div class="panel stats-panel">
          <div class="panel-title">属性 <span id="pending-points" class="highlight"></span></div>
          <div id="stats-display" class="stats-display"></div>
          <div id="allocate-buttons" class="allocate-buttons"></div>
        </div>

        <!-- Equipment Panel -->
        <div class="panel equip-panel">
          <div class="panel-title">装备</div>
          <div id="equipment-display" class="equipment-display"></div>
        </div>

        <!-- Auto Potion Settings -->
        <div class="panel auto-potion-panel">
          <div class="panel-title">自动喝药</div>
          <div id="auto-potion-settings" class="auto-potion-settings"></div>
        </div>
      </div>

      <!-- Center Panel: Combat Log -->
      <div class="center-panel">
        <div class="panel-title">战斗日志</div>
        <div id="combat-log" class="combat-log"></div>
      </div>

      <!-- Right Panel: Navigation + NPC + Skills + Inventory -->
      <div class="right-panel">
        <!-- Current Location & Navigation -->
        <div class="panel nav-panel">
          <div class="panel-title">位置</div>
          <div id="current-location" class="current-location"></div>
          <div id="nav-actions" class="nav-actions"></div>
        </div>

        <!-- NPC Shop (only shown in city) -->
        <div id="shop-panel" class="panel shop-panel" style="display:none;">
          <div class="panel-title">商店</div>
          <div id="shop-content" class="shop-content"></div>
        </div>

        <!-- Skills -->
        <div class="panel skills-panel">
          <div class="panel-title">技能</div>
          <div id="skills-display" class="skills-display"></div>
        </div>

      </div>
    </div>

    <!-- Quick Use Bar -->
    <div class="quick-bar" id="quick-bar">
      <span class="quick-bar-label">快捷</span>
      <div class="quick-slots" id="quick-slots"></div>
      <button id="btn-quickbar-config" class="btn btn-small">设置</button>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <button id="btn-start-stop" class="btn">暂停挂机</button>
      <button id="btn-save" class="btn">手动保存</button>
      <button id="btn-exit" class="btn">返回角色选择</button>
      <button id="btn-inventory" class="btn">背包 (0)</button>
      <span class="gold-display">金币: <span id="gold-text">0</span></span>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast"></div>

  <!-- Equipment Detail Modal -->
  <div id="equip-detail-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box equip-detail-box">
      <div class="modal-title" id="equip-detail-title"></div>
      <div class="modal-body" id="equip-detail-body"></div>
      <div class="modal-actions" id="equip-detail-actions">
        <button id="equip-detail-btn-action" class="btn equip-detail-action-btn">装备</button>
        <button id="equip-detail-close" class="btn">关闭</button>
      </div>
    </div>
  </div>

  <!-- Inventory Modal -->
  <div id="inventory-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-title">背包</div>
      <div class="modal-body" id="inventory-modal-body"></div>
      <div class="modal-actions">
        <button id="btn-inv-use" class="btn btn-small">使用</button>
        <button id="btn-inv-equip" class="btn btn-small">装备</button>
        <button id="btn-inv-sell" class="btn btn-small">出售</button>
        <button id="btn-inv-discard" class="btn btn-small">丢弃</button>
        <button id="btn-inv-close" class="btn btn-small">关闭</button>
      </div>
    </div>
  </div>

  <!-- Shop Modal -->
  <div id="shop-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-title" id="shop-modal-title"></div>
      <div class="modal-body" id="shop-modal-body"></div>
      <div class="modal-actions">
        <button id="shop-modal-close" class="btn">关闭</button>
        <span class="shop-buy-row-modal">
          数量 <input type="number" id="shop-modal-qty" class="shop-qty" value="1" min="1" max="99">
          <button id="btn-buy-modal" class="btn">购买</button>
        </span>
      </div>
    </div>
  </div>

  <!-- Quick Bar Config Modal -->
  <div id="quickbar-config-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-title">快捷栏设置</div>
      <div class="modal-body" id="quickbar-config-body"></div>
      <div class="modal-actions">
        <button id="btn-quickbar-save" class="btn">保存</button>
        <button id="btn-quickbar-close" class="btn">关闭</button>
      </div>
    </div>
  </div>

  <script src="game/character.js"></script>
  <script src="game/inventory.js"></script>
  <script src="game/engine.js"></script>
  <script>
    // Load game data via IPC before starting app
    (async function() {
      try {
        const data = await window.electronAPI.getGameData();
        window.gameData = data;
      } catch(e) {
        console.error('Failed to load game data:', e);
        window.gameData = {};
      }
      // Now load the main app
      const script = document.createElement('script');
      script.src = 'app.js';
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
